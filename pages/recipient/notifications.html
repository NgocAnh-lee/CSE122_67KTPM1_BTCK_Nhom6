<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông báo - ALQ ship</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/notifications.css">
</head>

<!-- data-*: cấu hình để main.js đọc (vai trò, định danh trang, tiêu đề, phụ đề) -->
<body data-root="../../" data-role="recipient" data-page="recipient/notifications" data-title="Thông báo" data-subtitle="Cập nhật mới nhất về đơn hàng của bạn">
  <div id="page-content">
    <div class="mb-3 text-end">
      <!-- JS gắn sự kiện click qua id="read-all" -->
      <button class="secondary" id="read-all">Đánh dấu tất cả đã đọc</button>
    </div>

    <!-- JS render danh sách thông báo vào đây -->
    <section class="panel notification-list" id="list"></section>

    <!-- Chỉ hiện khi không có thông báo (JS bỏ thuộc tính hidden) -->
    <div class="empty-inline" id="empty" hidden>Bạn chưa có thông báo nào.</div>
  </div>

  <!-- Thứ tự nạp: thư viện → logic chung → dữ liệu → logic riêng của trang -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/pages/notifications.js"></script>
</body>
</html>
