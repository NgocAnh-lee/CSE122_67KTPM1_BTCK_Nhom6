<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Báo cáo logistics - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="page-content">
    <div class="report-filter">
      <label>Ngày thống kê<input id="date" type="date" value="2025-05-19"></label>
      <label>Khu vực<select><option>Tất cả khu vực</option></select></label>
      <label>Đơn vị vận hành<select><option>Tất cả đơn vị</option></select></label>
      <button class="secondary" id="export"><span class="bi bi-download"></span> Xuất báo cáo</button>
    </div>
    <div class="kpis four">
      <div><span>Tổng đơn hàng</span><strong>28,492</strong><p class="positive">↑ 12.4% kỳ trước</p></div>
      <div><span>Tỷ lệ giao thành công</span><strong>96.8<small>%</small></strong><p class="positive">↑ 1.2% kỳ trước</p></div>
      <div><span>Thời gian giao TB</span><strong>31<small> giờ</small></strong><p class="positive">↓ 2.1 giờ kỳ trước</p></div>
      <div><span>Chi phí / đơn</span><strong>18.4<small>k</small></strong><p class="negative">↑ 0.6% kỳ trước</p></div>
    </div>
    <div class="ops-grid">
      <section class="panel"><div class="panel-title"><div><h3>Xu hướng sản lượng</h3><p id="sub"></p></div>
        <select id="period" class="form-select form-select-sm w-auto"><option>Theo ngày</option><option>Theo tháng</option><option>Theo năm</option></select></div>
        <div class="line-chart"><div class="chart-percentages"><span>96.8%</span><span>95.4%</span><span>97.1%</span><span>96.2%</span><span>98.0%</span></div>
          <svg viewBox="0 0 600 220" preserveAspectRatio="none"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d67ef" stop-opacity=".25"/><stop offset="1" stop-color="#2d67ef" stop-opacity="0"/></linearGradient></defs>
            <path class="area" d="M0 180 C70 150,90 160,140 110 S240 145,300 85 S400 115,460 55 S540 90,600 35 L600 220 L0 220Z"/><path class="line" d="M0 180 C70 150,90 160,140 110 S240 145,300 85 S400 115,460 55 S540 90,600 35"/></svg>
          <div id="axis"></div></div></section>
      <section class="panel"><div class="panel-title"><div><h3>Top lý do ngoại lệ</h3><p>1,204 trường hợp</p></div></div><div class="reason-bars" id="reasons"></div></section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/pages/admin-logistics-report.js"></script>
</body>
</html>
