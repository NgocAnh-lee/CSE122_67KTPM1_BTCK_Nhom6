<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý trạng thái - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="page-content">
    <div class="toolbar"><div class="search"><span class="bi bi-search"></span><input id="q" placeholder="Tìm trạng thái..." aria-label="Tìm trạng thái"></div>
      <button class="primary" id="add"><span class="bi bi-plus-lg"></span> Thêm trạng thái</button></div>
    <section class="panel status-panel">
      <div class="status-explain"><span class="bi bi-exclamation-triangle"></span><div><strong>Ngoại lệ là gì?</strong>
        <p>Ngoại lệ là tình huống khiến đơn không thể tiếp tục theo quy trình bình thường, ví dụ khách vắng, sai địa chỉ, hàng hư hỏng hoặc khách đổi lịch. Ngoại lệ cần điều phối viên tiếp nhận và đưa ra hướng xử lý.</p></div></div>
      <div class="list-head"><strong id="count"></strong><span>Danh sách dịch vụ và giải thích trạng thái giao hàng</span></div>
      <div id="list"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/pages/admin-status-management.js"></script>
</body>
</html>
