<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý người dùng - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="page-content">
    <div class="role-tabs" id="tabs"></div>
    <div class="toolbar"><div class="search"><span class="bi bi-search"></span><input id="q" placeholder="Tìm tên, email, vai trò..." aria-label="Tìm người dùng"></div>
      <button class="primary" id="pending-btn"><span class="bi bi-people"></span> Hàng đợi người dùng <span class="badge badge-red" id="pending-count"></span></button></div>
    <section class="panel users-table table-wrap"><table><thead><tr><th>Người dùng</th><th>Vai trò</th><th>Phạm vi</th><th>Trạng thái</th><th>Đăng nhập gần nhất</th><th></th></tr></thead><tbody id="rows"></tbody></table>
      <div class="empty-inline" id="empty" hidden>Không có người dùng phù hợp.</div></section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/pages/admin-user-management.js"></script>
</body>
</html>
