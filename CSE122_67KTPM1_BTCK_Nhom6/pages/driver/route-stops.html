<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lộ trình hôm nay - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="page-content">
    <div class="kpis">
      <div><span>Đã hoàn thành</span><strong>8 <small>/ 14</small></strong><div class="progress mt-1" style="height:4px"><div class="progress-bar" style="width:57%"></div></div></div>
      <div><span>Quãng đường còn lại</span><strong>12.4 <small>km</small></strong><p>Khoảng 2 giờ 15 phút</p></div>
      <div><span>Ngoại lệ</span><strong class="orange">2</strong><p>Cần xử lý trước 14:00</p></div>
    </div>
    <div class="toolbar">
      <div class="search"><span class="bi bi-search"></span><input id="q" placeholder="Tìm người nhận, địa chỉ..." aria-label="Tìm kiếm"></div>
      <button class="primary" id="optimize"><span class="bi bi-stars"></span> Tối ưu tuyến</button>
    </div>
    <section class="route-layout">
      <div class="stop-list"><div class="list-head"><strong>Điểm dừng</strong><span id="count"></span></div><div id="stops"></div></div>
      <div class="map-mock"><div class="map-grid"></div><div id="pins"></div>
        <div class="route-detail-card">
          <div class="route-card-head"><span class="bi bi-geo-alt"></span><div><strong id="c-name"></strong><p id="c-addr"></p></div><span class="badge" id="c-badge"></span></div>
          <div class="route-metrics"><span><b id="c-km"></b>Quãng đường</span><span><b id="c-min"></b>Thời gian</span><span><b id="c-time"></b>Dự kiến</span></div>
          <div class="turn-guide" id="guide" hidden><strong id="g-title"></strong><p>Đi thẳng 450 m trên đường Duy Tân</p><p>Rẽ phải vào Trần Thái Tông, đi tiếp 1.2 km</p><p>Điểm đến nằm bên phải, sảnh B</p></div>
          <div class="route-card-actions" id="c-actions"><button class="secondary" id="c-view">Xem chi tiết</button><button class="primary" id="c-go"><span class="bi bi-signpost-split"></span> Chỉ đường</button></div>
        </div></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/pages/driver-route-stops.js"></script>
</body>
</html>
