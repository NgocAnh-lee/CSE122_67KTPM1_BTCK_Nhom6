<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Báo cáo ngoại lệ - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="page-content">
    <div class="form-layout">
      <section class="panel"><form id="form" novalidate>
        <div class="section-heading"><span>01</span><div><h3>Mô tả tình huống</h3><p>Cung cấp thông tin để điều phối viên hỗ trợ</p></div></div>
        <label class="field-label">Điều gì đã xảy ra? *
          <textarea id="note" maxlength="300" placeholder="Ví dụ: Đã gọi 3 lần nhưng khách không nghe máy..."></textarea><small id="count">0/300 ký tự</small></label>
        <div class="section-heading"><span>02</span><div><h3>Phân loại ngoại lệ</h3><p>Chọn thủ công hoặc dùng AI hỗ trợ</p></div></div>
        <select id="type" class="form-select"><option value="">Chọn loại ngoại lệ</option><option>Khách hàng vắng mặt</option><option>Sai địa chỉ</option><option>Khách từ chối nhận</option><option>Hàng hư hỏng</option></select>
        <div class="form-actions"><button class="secondary" id="draft" type="button">Lưu nháp</button><button class="primary" id="submit" type="submit" disabled>Gửi báo cáo</button></div>
      </form></section>
      <aside class="ai-assistant">
        <div class="ai-head"><div class="ai-icon"><span class="bi bi-stars"></span></div><div><small>PARCEL AI</small><h3>Phân loại thông minh</h3></div></div>
        <div id="ai"></div>
      </aside>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/pages/driver-exception-create.js"></script>
</body>
</html>
