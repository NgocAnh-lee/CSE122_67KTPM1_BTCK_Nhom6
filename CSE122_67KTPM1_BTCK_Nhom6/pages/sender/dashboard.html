<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="page-content">
    <div class="kpis four">
      <div><span>Đơn tạo hôm nay</span><strong>24</strong><p class="positive">↑ 6 đơn so với hôm qua</p></div>
      <div><span>Đang vận chuyển</span><strong>86</strong><p>Trên 12 tuyến giao</p></div>
      <div><span>Đã giao</span><strong>148</strong><p class="positive">Tỷ lệ thành công 97.4%</p></div>
      <div><span>Chờ đối soát</span><strong>12.8<small>trđ</small></strong><p>Kỳ 16–31/05</p></div>
    </div>
    <div class="quick-grid">
      <button data-go="create"><span class="bi bi-plus-lg fs-4"></span><strong>Tạo đơn mới</strong><span>Tạo vận đơn và yêu cầu lấy hàng</span></button>
      <button data-go="shipments"><span class="bi bi-box-seam fs-4"></span><strong>Tra cứu đơn gửi</strong><span>Theo dõi toàn bộ đơn hàng</span></button>
      <button data-go="returns"><span class="bi bi-arrow-return-left fs-4"></span><strong>Xử lý hoàn trả</strong><span>3 đơn đang chờ xác nhận</span></button>
    </div>
    <section class="panel table-wrap"><div class="panel-title"><div><h3>Đơn gần đây</h3><p id="recent-sub"></p></div></div>
      <table><thead><tr><th>Mã vận đơn</th><th>Người nhận</th><th>Địa chỉ</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/pages/sender-dashboard.js"></script>
</body>
</html>
