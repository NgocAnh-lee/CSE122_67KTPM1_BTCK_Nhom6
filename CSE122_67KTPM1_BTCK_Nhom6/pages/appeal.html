<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khiếu nại khoá tài khoản - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-root="../" data-form="appeal">
  <div class="auth-page container-fluid p-0">
    <section class="auth-visual">
      <div class="brand"><div><span class="bi bi-box-seam"></span></div><strong>ALQ <span>ship</span></strong></div>
      <div><span class="badge badge-blue">NỀN TẢNG LOGISTICS THÔNG MINH</span>
        <h1>Mọi hành trình.<br><span>Một nhịp kết nối.</span></h1>
        <p>Theo dõi, giao nhận và xử lý ngoại lệ trên một nền tảng dành cho mọi vai trò.</p></div>
      <div></div>
    </section>
    <section class="auth-form-wrap">
      <form class="auth-form" id="form" novalidate>
        <a class="back-link" href="login.html">← Quay lại đăng nhập</a>
        <div class="auth-symbol"><span class="bi bi-exclamation-triangle fs-3"></span></div><h2>Khiếu nại khoá tài khoản</h2>
        <p>Cung cấp thông tin để quản trị viên kiểm tra và cân nhắc mở lại tài khoản.</p>
        <label class="field-label">Email hoặc số điện thoại<input id="contact" placeholder="0123456789"></label>
        <label class="field-label">Nội dung khiếu nại<textarea id="text" placeholder="Giải thích lý do và thông tin xác minh bổ sung..."></textarea></label>
        <button class="primary full" type="submit">Gửi yêu cầu mở lại</button>
        <div class="auth-error" id="error" hidden><span class="bi bi-exclamation-triangle"></span><span id="error-text"></span></div>
      </form>
      <div class="auth-form" id="done" hidden>
        <div class="success-state"><div><span class="bi bi-check-lg fs-2"></span></div><h2 id="done-title"></h2><p id="done-text"></p>
          <a class="primary full text-decoration-none" href="login.html">Về trang đăng nhập</a></div>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/pages/auth-forms.js"></script>
</body>
</html>
