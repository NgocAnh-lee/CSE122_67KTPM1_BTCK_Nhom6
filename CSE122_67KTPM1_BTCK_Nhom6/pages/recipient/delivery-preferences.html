<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuỳ chọn giao hàng - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="page-content">
    <div class="settings-layout">
      <section class="panel">
        <div class="section-heading"><span>01</span><div><h3>Khung giờ ưu tiên</h3><p>Áp dụng cho các đơn chưa bắt đầu giao</p></div></div>
        <div class="slot-grid" id="slots"></div>
      </section>
      <section class="panel">
        <div class="section-heading"><span>02</span><div><h3>Hướng dẫn cho tài xế</h3><p>Giúp việc giao hàng thuận lợi hơn</p></div></div>
        <label class="field-label">Ghi chú giao hàng
          <textarea id="note" maxlength="160"></textarea><small id="count"></small></label>
        <label class="toggle-row"><div><strong>Cho phép giao tại nơi an toàn</strong><p>Tài xế có thể để hàng tại vị trí bạn chỉ định</p></div>
          <input type="checkbox" id="safe"><i></i></label>
      </section>
      <section class="panel">
        <div class="section-heading"><span>03</span><div><h3>Địa chỉ mặc định</h3><p>Dùng cho các lần giao tiếp theo</p></div></div>
        <div class="address-card"><div class="pin-box"><span class="bi bi-geo-alt"></span></div>
          <div><span class="badge badge-green">MẶC ĐỊNH</span><h4>Nhà riêng</h4><p>18 Trần Thái Tông, Cầu Giấy, Hà Nội</p></div></div>
      </section>
      <div class="save-bar"><p>Mọi thay đổi sẽ áp dụng cho các đơn đủ điều kiện.</p><button class="primary" id="save">Lưu thay đổi</button></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/pages/delivery-preferences.js"></script>
</body>
</html>
