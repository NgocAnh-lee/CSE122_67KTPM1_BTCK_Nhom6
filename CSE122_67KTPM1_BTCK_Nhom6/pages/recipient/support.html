<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phản hồi sự cố - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="page-content">
    <div class="form-layout">
      <section class="panel">
        <form id="form" novalidate>
          <div class="section-heading"><span>01</span><div><h3>Thông tin yêu cầu</h3><p>Chúng tôi chuyển phản hồi trực tiếp đến điều phối viên phụ trách</p></div></div>
          <label class="field-label">Đơn hàng<select id="order"></select></label>
          <label class="field-label">Vấn đề cần hỗ trợ
            <select id="issue"><option>Tài xế chưa đến</option><option>Muốn đổi thời gian giao</option><option>Hàng có dấu hiệu hư hỏng</option><option>Vấn đề khác</option></select></label>
          <label class="field-label">Nội dung chi tiết
            <textarea id="detail" placeholder="Mô tả tình huống để chúng tôi hỗ trợ nhanh hơn..."></textarea><small id="err" class="text-danger" hidden></small></label>
          <button class="primary full" type="submit">Gửi đến điều phối viên</button>
        </form>
        <div class="success-state" id="done" hidden><div><span class="bi bi-check-lg fs-2"></span></div><h2>Đã gửi phản hồi</h2>
          <p id="code"></p><button class="secondary" id="again">Tạo phản hồi khác</button></div>
      </section>
      <aside class="panel"><h3>Yêu cầu gần đây</h3>
        <div class="timeline" id="history"></div>
        <div class="empty-inline" id="empty" hidden>Chưa có yêu cầu nào.</div></aside>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/pages/support.js"></script>
</body>
</html>
