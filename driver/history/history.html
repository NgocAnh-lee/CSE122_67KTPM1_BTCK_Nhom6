<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch sử ca làm việc - ALQ ship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../CSE122_67KTPM1_BTCK_Nhom6/css/style.css" />
  <link rel="stylesheet" href="./history.css" />
</head>
<body>
  <div class="app-shell">
    <main>
      <header class="page-header">
        <div>
          <h1>Lịch sử ca làm việc</h1>
          <p>Thống kê hiệu suất giao hàng cá nhân</p>
        </div>
        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="Thông báo">
            <span class="bi bi-bell"></span>
            <span class="notify-dot"></span>
          </button>
          <div class="avatar">DN</div>
        </div>
      </header>

      <div class="kpis" id="kpis"></div>

      <section class="panel">
        <div class="panel-title">
          <div>
            <h3>Danh sách chi tiết</h3>
            <p>Dữ liệu cập nhật theo thời gian thực</p>
          </div>
          <button class="primary" id="add" type="button">
            <span class="bi bi-plus-lg"></span> Thêm mới
          </button>
        </div>
        <div class="generic-list" id="list"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="historyModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="panel-title modal-header">
        <div>
          <span class="badge badge-blue">CHI TIẾT</span>
          <h2 id="modalTitle">Ca làm việc</h2>
          <p id="modalSubtitle">Lịch sử ca làm việc</p>
        </div>
        <button type="button" class="icon-button close-btn" aria-label="Đóng">×</button>
      </div>
      <div class="info-row">
        <span class="bi bi-clock-history"></span>
        <div>
          <span>Thông tin</span>
          <strong id="modalInfo">-</strong>
        </div>
      </div>
      <div class="driver-note">
        <strong>Trạng thái hiện tại</strong>
        <p id="modalStatus">-</p>
      </div>
      <div class="form-actions">
        <button class="primary" id="modalOk" type="button">Đã hiểu</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./history.js"></script>
</body>
</html>
